name: Release

# Builds SeryMusic-release.apk (phones), SeryMusic-tv.apk (Fire TV / Android TV) and
# SeryMusic-web.zip (the Python server version in web/), and publishes them as a GitHub release.
# Triggered by pushing a tag named after `versionName` in gradle/libs.versions.toml,
# e.g. `v2.2.3`. In-app updater compares that tag with the installed version.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release, e.g. v2.2.3
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      KEYSTORE_PATH: .ignore.d/keystores/local.keystore
      APK_DIR: composeApp/build/outputs/apk/githubUniversalProd/release

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # APK must always be signed with the same key, otherwise Android refuses
      # to install it over the existing app. Build fails instead of falling back
      # to a throwaway key that nobody can update from.
      - name: Restore keystore
        env:
          LOCAL_KEYSTORE: ${{ secrets.LOCAL_KEYSTORE }}
        run: |
          if [ -z "$LOCAL_KEYSTORE" ]; then
            echo "::error::Secret LOCAL_KEYSTORE (base64 of local.keystore) is not set"
            exit 1
          fi
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          echo "$LOCAL_KEYSTORE" | base64 -d > "$KEYSTORE_PATH"

      - name: Setup Java 21
        uses: actions/setup-java@v5.5.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Build phone APK
        run: |
          ./gradlew assembleGithubUniversalProdRelease
          mkdir -p dist && cp "$APK_DIR/SeryMusic-release.apk" dist/

      # Same app and signature; only the launcher icon and the file the updater fetches differ
      - name: Build TV APK
        run: |
          ./gradlew assembleGithubUniversalProdRelease -Ptv
          cp "$APK_DIR/SeryMusic-tv.apk" dist/

      - name: Package web version
        run: git archive --format=zip --prefix=SeryMusic-web/ -o dist/SeryMusic-web.zip HEAD:web

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/SeryMusic-release.apk dist/SeryMusic-tv.apk dist/SeryMusic-web.zip --title "$TAG" --generate-notes
